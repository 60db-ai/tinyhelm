[package]
name = "tinyhelm-gateway"
version = "0.1.0"
edition = "2021"
description = "TinyHelm Rust front-door: serves the SPA and proxies /api to the Laravel backend (strangler step toward an all-Rust backend)."

[dependencies]
axum = "0.7.9"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "trace", "cors"] }
reqwest = { version = "0.12.12", features = ["stream"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
