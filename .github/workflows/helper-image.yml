name: Publish helper image

# Builds the TinyHelm build-helper and publishes it to GitHub Container Registry
# (ghcr.io/60db-ai/tinyhelm). This is the image every deployment pulls.
# Run manually (Actions > Publish helper image > Run workflow) or on Dockerfile/version changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/tinyhelm-helper/**
      - upstream.json
      - .github/workflows/helper-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tinyhelm

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read helper version
        id: ver
        run: echo "version=$(jq -r '.helper.version' upstream.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/tinyhelm-helper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          provenance: false
