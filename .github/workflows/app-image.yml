name: Publish app image

# Builds the main TinyHelm app image and publishes it to GHCR (ghcr.io/60db-ai/tinyhelm).
# Free on public repos. On a private repo, prefer scripts/publish-images.sh to avoid Actions minutes.
# Run manually (Actions > Publish app image > Run workflow) or on relevant changes to main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/production/Dockerfile
      - release.json
      - .github/workflows/app-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tinyhelm

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: echo "version=$(jq -r '.stable.tinyhelm // "latest"' release.json)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TINYHELM_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          provenance: false
