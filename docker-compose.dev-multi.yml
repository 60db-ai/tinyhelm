# Development stack used by scripts/dev: one isolated Compose project per dev
# instance (git branch), with its own container names, network, volumes, and ports.
#
#   ./scripts/dev start      # this branch's instance (KVM or testing-host)
#   ./scripts/dev urls       # all instances and their ports
#   ./scripts/dev stop
#
# Env: <checkout>/.env, then <main checkout>/.dev-instances/<name>.env (generated).
# Optional profiles: vite, mailpit, minio, testing-host (scripts/dev enables them).

services:
  tinyhelm:
    image: tinyhelm:dev
    pull_policy: never
    container_name: "${COMPOSE_PROJECT_NAME:-tinyhelm-dev}"
    build:
      context: .
      dockerfile: ./docker/development/Dockerfile
      args:
        - USER_ID=${USERID:-1000}
        - GROUP_ID=${GROUPID:-1000}
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8080"
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_PUSHER_PORT:-6001}:6001"
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_TERMINAL_PORT:-6002}:6002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTORUN_ENABLED: "${AUTORUN_ENABLED:-false}"
      APP_NAME: "${APP_NAME:-TinyHelm}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-tinyhelm}"
      DB_USERNAME: "${DB_USERNAME:-tinyhelm}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      TINYHELM_CONTAINER_ROLE: "${TINYHELM_CONTAINER_ROLE:-all}"
      PUSHER_HOST: "${PUSHER_HOST:-}"
      # Browser-facing ports must match the host-published ports of this instance.
      PUSHER_PORT: "${FORWARD_PUSHER_PORT:-6001}"
      TERMINAL_PORT: "${FORWARD_TERMINAL_PORT:-6002}"
      PUSHER_BACKEND_PORT: 6001
      PUSHER_SCHEME: "${PUSHER_SCHEME:-http}"
      PUSHER_APP_ID: "${PUSHER_APP_ID:-tinyhelm}"
      PUSHER_APP_KEY: "${PUSHER_APP_KEY:-tinyhelm}"
      PUSHER_APP_SECRET: "${PUSHER_APP_SECRET:-tinyhelm}"
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      # Same values as the host-side `php artisan dev:qemu` call (config/development-qemu.php).
      DEVELOPMENT_QEMU_INSTANCE: "${DEVELOPMENT_QEMU_INSTANCE:-}"
      DEVELOPMENT_QEMU_SLOT: "${DEVELOPMENT_QEMU_SLOT:-}"
      DEVELOPMENT_QEMU_DOCKER_NETWORK: "${COMPOSE_PROJECT_NAME:-tinyhelm-dev}"
      DEVELOPMENT_QEMU_TINYHELM_CONTAINER: "${COMPOSE_PROJECT_NAME:-tinyhelm-dev}"
      # Host paths of the volumes that testing-host mounts at /data/tinyhelm and /data/tinyhelm/backups.
      # TinyHelm uses them only for the testing-host server (it shares the host Docker daemon), not for KVM servers.
      DEV_TINYHELM_DATA_VOLUME: "${COMPOSE_PROJECT_NAME:-tinyhelm-dev}_tinyhelm_data"
      DEV_TINYHELM_BACKUPS_VOLUME: "${COMPOSE_PROJECT_NAME:-tinyhelm-dev}_backups_data"
    healthcheck:
      test: curl -sf http://127.0.0.1:8080/api/health || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - .:/var/www/html/:cached
      - backups_data:/var/www/html/storage/app/backups
      - ./docker/tinyhelm-terminal/terminal-server.js:/terminal/terminal-server.js
      - ./docker/tinyhelm-terminal/terminal-utils.js:/terminal/terminal-utils.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tinyhelm

  postgres:
    image: postgres:15-alpine
    pull_policy: always
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USERNAME:-tinyhelm}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
      POSTGRES_DB: "${DB_DATABASE:-tinyhelm}"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-tinyhelm}", "-d", "${DB_DATABASE:-tinyhelm}"]
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tinyhelm

  redis:
    image: redis:7-alpine
    pull_policy: always
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      retries: 10
      timeout: 2s
    volumes:
      - redis_data:/data
    networks:
      - tinyhelm

  vite:
    profiles: ["vite"]
    image: node:24-alpine
    pull_policy: always
    working_dir: /var/www/html
    environment:
      # Set VITE_HOST in .env to a browser-reachable IP/hostname for LAN/Tailscale access
      VITE_HOST: "${VITE_HOST:-localhost}"
      VITE_PORT: "${VITE_PORT:-5173}"
      VITE_PROTOCOL: "${VITE_PROTOCOL:-http}"
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html/:cached
    command: sh -c "npm install && npm run dev"
    networks:
      - tinyhelm

  tinyhelm-helper:
    image: 60db-ai/tinyhelm-helper:dev
    pull_policy: build
    build:
      context: https://github.com/60db-ai/tinyhelm-helper.git#main:src
      args:
        - IMAGE_VERSION=dev
    command: ["true"]

  testing-host:
    profiles: ["testing-host"]
    image: tinyhelm-testing-host:dev
    pull_policy: never
    build:
      context: .
      dockerfile: ./docker/testing-host/Dockerfile
    init: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tinyhelm_data:/data/tinyhelm
      # Same path as on the Docker host, so bind mounts created through the host daemon resolve.
      - tinyhelm_data:/var/lib/docker/volumes/${COMPOSE_PROJECT_NAME:-tinyhelm-dev}_tinyhelm_data/_data
      - backups_data:/data/tinyhelm/backups
      - postgres_data:/data/tinyhelm/_volumes/database
      - redis_data:/data/tinyhelm/_volumes/redis
      - minio_data:/data/tinyhelm/_volumes/minio
      # Image scanner files: the scanner containers bind-mount these paths through the host daemon.
      - /data/tinyhelm/image-scans:/data/tinyhelm/image-scans
    networks:
      tinyhelm:
        # Seeders use this hostname for the localhost server.
        aliases:
          - tinyhelm-testing-host

  mailpit:
    profiles: ["mailpit"]
    image: axllent/mailpit:latest
    pull_policy: always
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      tinyhelm:
        # The seeded instance SMTP settings (InstanceSettingsSeeder) use tinyhelm-mail:1025.
        aliases:
          - tinyhelm-mail

  minio:
    profiles: ["minio"]
    image: 60db-ai/maxio:latest
    pull_policy: always
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_MINIO_PORT:-9000}:9000"
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${FORWARD_MINIO_PORT_CONSOLE:-9001}:9001"
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    networks:
      tinyhelm:
        # The seeded "Local MinIO" storage (S3StorageSeeder) uses http://tinyhelm-minio:9000.
        aliases:
          - tinyhelm-minio

  minio-init:
    profiles: ["minio"]
    image: ghcr.io/60db-ai/mx:0.2.1
    pull_policy: always
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 2; done;
      mc mb local/local --ignore-existing;
      "
    networks:
      - tinyhelm

volumes:
  backups_data:
  postgres_data:
  redis_data:
  tinyhelm_data:
  minio_data:

networks:
  tinyhelm:
    name: "${COMPOSE_PROJECT_NAME:-tinyhelm-dev}"
    driver: bridge
